<svg viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12876f"/>
      <stop offset="1" stop-color="#073d35"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="15%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#04211c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="460" fill="url(#bg)"/>
  <rect width="1200" height="460" fill="url(#glow)"/>

  <!-- De route -->
  <path d="M -20 340 C 160 220, 320 420, 480 300 S 760 120, 940 220 S 1180 140, 1240 100"
        fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 22"/>

  <!-- Verhaal-stops langs de route: elk een ander icoon, kasteel / blad / boek / camera / vonk -->
  <g filter="url(#soft)">
    <!-- 1: kasteel (geschiedenis) -->
    <g transform="translate(150,235)">
      <circle r="34" fill="#e85a5a"/>
      <path d="M-14 8 h28 v-10 h-6 v-8 h-4 v6 h-8 v-6 h-4 v6 h-6 v8 z" fill="#fff"/>
    </g>
    <!-- 2: blad (natuur) -->
    <g transform="translate(410,335)">
      <circle r="30" fill="#7b5ea7"/>
      <path d="M-10 9 C-10 -6 5 -12 12 -12 C12 -3 6 9 -10 9 Z" fill="#fff"/>
    </g>
    <!-- 3: boek (verhalen) -->
    <g transform="translate(660,168)">
      <circle r="34" fill="#12876f"/>
      <path d="M-12 -8 h11 a3 3 0 013 3 v14 a3 3 0 00-3-2 h-11 z M12 -8 h-11 a3 3 0 00-3 3 v14 a3 3 0 013-2 h11 z" fill="#fff"/>
    </g>
    <!-- 4: camera (fotografie) -->
    <g transform="translate(910,235)">
      <circle r="30" fill="#e85a5a"/>
      <rect x="-11" y="-6" width="22" height="15" rx="3" fill="#fff"/>
      <circle cx="0" cy="1.5" r="4.5" fill="#12876f"/>
    </g>
    <!-- 5: vonk (weetjes / spraak) -->
    <g transform="translate(1090,150)">
      <circle r="26" fill="#7b5ea7"/>
      <path d="M0 -10 L3 -2 L11 0 L3 2 L0 10 L-3 2 L-11 0 L-3 -2 Z" fill="#fff"/>
    </g>
  </g>

  <!-- Route-voertuig-indicator, zoals in de app -->
  <g transform="translate(780,200)">
    <circle r="14" fill="#ffffff"/>
    <circle r="20" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
  </g>
</svg>
